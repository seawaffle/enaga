# On a version tag (v0.1.0, ...): build the firmware and publish a GitHub release with one zip per device, the
# SDK (tools/make_sdk.py), the prebuilt toolchain and the toolchain's source (tools/package_toolchain.py: GCC and
# binutils are GPLv3, so their source goes out with the binaries).
# The SDK holds the DSP library prebuilt by TI's cl6x (make_sdk.py --prebuilt). TI's Linux installer for CGT
# 8.5.0.LTS is a public download (no login), pinned by its SHA-256 from TI's download page and cached, so TI's
# server is asked only when the cache is empty (tried on branch ci-cl6x, 2026-11-26).
# Each zip holds the update file under the name the bootloader looks for (spaces included, which GitHub would
# rewrite in a bare asset name). The tag must match VERSION in firmware/build.py, which names the image.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGT_VERSION: 8.5.0.LTS
  CGT_URL: https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-vqU2jj6ibH/8.5.0.LTS/ti_cgt_c6000_8.5.0.LTS_linux-x64_installer.bin
  CGT_SHA256: 772511aa92dc36bd32622aad754c08797cefd8973bfd6c7bc1ceeb784955b37c

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against firmware/build.py
        run: |
          version=$(python3 -B -c "import sys; sys.path.insert(0, 'firmware'); import build; print('.'.join(map(str, build.VERSION)))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version} in firmware/build.py"
            exit 1
          fi

      # The tic6x toolchain takes 20-30 minutes to build; it is rebuilt only when its scripts or patch change.
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: tools/tic6x
          key: tic6x-ubuntu-24.04-${{ hashFiles('tools/build_tic6x_binutils.sh', 'tools/build_tic6x_gcc.sh', 'tools/patches/**') }}

      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison
          tools/build_tic6x_binutils.sh || { tail -50 tools/binutils-build/build/*.log; exit 1; }
          tools/build_tic6x_gcc.sh || { tail -50 tools/gcc-build/build/*.log; exit 1; }

      - name: Build the firmware
        run: python3 -B firmware/build.py

      - name: Restore TI's compiler
        id: cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c6000-${{ env.CGT_VERSION }}-${{ env.CGT_SHA256 }}

      - name: Download and install TI's compiler
        if: steps.cgt.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o /tmp/cgt-installer.bin "$CGT_URL"
          echo "$CGT_SHA256  /tmp/cgt-installer.bin" | sha256sum -c
          chmod +x /tmp/cgt-installer.bin
          /tmp/cgt-installer.bin --mode unattended --prefix "$HOME/ti"
          rm /tmp/cgt-installer.bin

      - name: Package
        run: |
          mkdir -p dist
          for dir in build/firmware/*/; do
            device=$(basename "$dir")
            (cd "$dir" && python3 -m zipfile -c "$GITHUB_WORKSPACE/dist/enaga-${GITHUB_REF_NAME}-${device}.zip" *.bin)
          done
          ENAGA_TI_CGT="$HOME/ti/ti-cgt-c6000_${CGT_VERSION}" python3 -B tools/make_sdk.py "$GITHUB_REF_NAME" --prebuilt
          python3 -B tools/package_toolchain.py "$GITHUB_REF_NAME"
          cp build/dist/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Enaga ${GITHUB_REF_NAME}" --notes \
            "Firmware update files for the SmplTrek, Lofi-12 XT and CyDrums (only the SmplTrek has been tested).
          Unzip the file for your device and copy the .bin to the root of the SD card, keeping its name; then follow
          \"Installing\" in the README.

          For writing apps: enaga-sdk-${GITHUB_REF_NAME}.zip and enaga-toolchain-${GITHUB_REF_NAME}-linux-x86_64.tar.xz
          (docs/getting-started.md in the SDK). The toolchain's source, GCC and binutils (GPLv3) with GMP, MPFR,
          MPC and ISL, is enaga-toolchain-${GITHUB_REF_NAME}-source.tar."
